<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>视觉跟随</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#15151a;color:#e1e1e4;font:14px/1.4 sans-serif}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input{font:inherit;color:inherit;background:#33333b;border:1px solid #50505c;border-radius:5px}button{min-height:44px;padding:8px;touch-action:manipulation}button:disabled{opacity:.55}button:focus-visible{outline:2px solid #a78bfa}#workspace{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr);gap:8px;padding:8px}#controls{background:#242429;border-radius:7px;padding:8px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px}#motionActions{display:flex;gap:6px}#motionActions button{flex:1;min-width:0;padding:6px 2px}#enableFollow{background:#7864c4;border-color:#a78bfa}#disableFollow{background:#48303d;border-color:#ba6d87}#targetMenu{position:relative}#targetToggle{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left}#targetOptions{margin-top:4px;background:#33333b;border:1px solid #61567e;border-radius:5px;padding:4px;display:grid;gap:4px}#targetOptions[hidden]{display:none}#targetOptions button{text-align:left;border:0;background:transparent}#targetOptions button[aria-selected=true]{background:#554677;color:#fff}#targetLabel{font-size:12px;display:block;margin-bottom:4px}#distanceControls{display:flex;gap:8px;align-items:center}input[type=range]{accent-color:#a78bfa;min-width:0;flex:1;width:80px}#distanceValue{width:64px;min-height:42px;padding:8px}#feedback{font-size:12px;color:#c7b9ee;overflow-wrap:anywhere;margin:0;white-space:pre-line}#help{font-size:12px}summary{padding:6px 0;cursor:pointer}#panel{display:none}#stage{background:#0f0f13;border-radius:7px;min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center}#stage [data-ui=kcfPicker]{position:relative;flex:none;overflow:hidden}#stage [data-ui=kcfPreview],#stage [data-ui=kcfCanvas]{display:block;width:100%;height:100%;object-fit:contain}#stage [hidden],#stage [data-ui=kcfLoading]{display:none!important}#stage [data-ui=kcfCanvas]{touch-action:none}
@media(orientation:portrait){#workspace{grid-template-columns:1fr;grid-template-rows:minmax(160px,1fr) minmax(240px,45%)}#stage{grid-row:1}#controls{grid-row:2}}@media(max-height:370px){#controls{gap:6px}}
</style></head><body><div id="workspace"><aside id="controls"><div id="motionActions"><button id="enableFollow">开启底盘跟随</button><button id="disableFollow">关闭底盘跟随</button></div><div id="targetMenu"><span id="targetLabel">跟随对象</span><button id="targetToggle" aria-expanded="false" aria-controls="targetOptions"><span id="targetName">颜色识别与跟随</span><span>⌄</span></button><div id="targetOptions" role="listbox" aria-label="跟随对象" hidden><button role="option" data-mode="color" aria-selected="true">颜色 · 红绿蓝黄</button><button role="option" data-mode="shape" aria-selected="false">形状 · 矩形/圆形/三角形</button><button role="option" data-mode="codes" aria-selected="false">二维码 · QR + AprilTag</button><button role="option" data-mode="human" aria-selected="false">人体 · 👍或点击绑定</button></div></div><label for="distanceValue">跟随距离</label><div id="distanceControls"><input id="distanceSlider" aria-label="跟随距离滑块" type="range" min="0.2" max="3.5" step="0.05" value="2"><input id="distanceValue" aria-label="跟随距离米" type="number" min="0.2" max="3.5" step="0.05" value="2"><span>m</span></div><p id="feedback" role="status">正在连接机器人…</p><details id="help"><summary>操作说明</summary><p>选择识别类型后，轻点画面中的检测框绑定目标。颜色识别红、绿、蓝、黄；形状识别矩形、圆形、三角形；二维码同时识别 QR 内容与 AprilTag 编号。</p><p>人体可点击人物框或竖起大拇指绑定；握拳停止跟随，1 前进、2 后退。底盘是否运动由上方开启/关闭控制。</p><p>拖动距离后松手，或输入距离后完成编辑，直接生效。退出应用不等于停车。</p></details><main id="panel"></main></aside><section id="stage" class="vision-kcf-window" aria-label="实时识别与跟随画面"></section></div><script src="vision-reference.js"></script><script src="vision-follow.js"></script></body></html>
