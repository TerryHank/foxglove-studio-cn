<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>104 视觉跟随</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111720;color:#e5edf7;font:14px/1.4 sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#1d2735;flex:none}button,select,input{font:inherit;color:inherit;background:#293f59;border:1px solid #526983;border-radius:6px}button,select{min-height:42px;padding:6px 10px;touch-action:manipulation}header select{flex:1;min-width:0}#connection{font-size:11px;max-width:96px}#status{font-size:11px;line-height:16px;margin:0;padding:4px 10px;max-height:40px;overflow:auto;flex:none;color:#bacbdd}
#workspace{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr);gap:8px;padding:0 8px 8px}#controls{min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;background:#192230;border-radius:8px;padding:8px}#stage.vision-kcf-window{min-width:0;min-height:0;padding:0;overflow:hidden;position:relative;background:#090e14;border-radius:8px;display:flex;align-items:center;justify-content:center}
#stage [data-ui=kcfPicker]{position:relative;flex:none;align-self:auto;min-height:0;aspect-ratio:auto;overflow:hidden;background:#090e14}#stage [data-ui=kcfPreview],#stage [data-ui=kcfCanvas]{display:block;width:100%;height:100%;object-fit:contain}#stage [hidden]{display:none!important}
#body[hidden]{display:none}#body{display:grid;grid-template-columns:1fr 1fr;gap:6px}#body button{min-width:0}#motionBody,#body label,#applyDistance,#bodyState{grid-column:1/-1}#startBody{background:#1467ad}#stopBody{background:#9a343f}#body label{display:flex;align-items:center;gap:6px;font-size:12px}#distance{width:75px;flex:1;min-width:0;height:40px;padding:6px}#bodyState{font-size:12px;margin:3px 0;color:#9fd3ff}
#help{font-size:12px;margin:6px 0}#help summary{cursor:pointer;padding:5px 0}#help p{margin:5px 0}#controls #help{order:2}#controls{display:flex;flex-direction:column}#panel{order:1}#body{order:0}
#panel .vision-kcf-window{padding:0;height:auto;overflow:visible;font-size:13px;background:transparent}#panel [data-ui=kcfControls]{display:flex;gap:6px;margin:0;padding:0}#panel [data-ui=kcfControls]>strong{display:none}#panel button{min-height:42px;padding:6px;font-size:13px}#panel .vd-row{margin:0!important;gap:6px}#panel p{font-size:11px;margin:0;overflow-wrap:anywhere}#panel label{font-size:12px;margin:0}#panel input{margin:3px 0;padding:5px;min-height:36px}#panel input[type=range]{min-width:0}#panel input[type=number]{max-width:75px}#panel details{font-size:11px;margin:0}#panel .vision-body-preview{display:none}#panel [data-ui=kcfMotionReply]:empty,#panel [data-ui=kcfDistanceReply]:empty{display:none}
@media(orientation:portrait){#workspace{grid-template-columns:1fr;grid-template-rows:minmax(150px,1fr) minmax(210px,45%)}#stage{grid-row:1}#controls{grid-row:2}header{flex-wrap:wrap}header select{order:3;flex-basis:65%}#connection{margin-left:auto}#body{grid-template-columns:1fr 1fr}#panel [data-ui=kcfControls]{max-width:100%}}

header,#status,#body,#panel{display:none!important}#workspace{padding-top:8px}#controls{gap:12px}#motionActions{display:flex;gap:6px}#motionActions button{flex:1;min-width:0;padding:8px 2px}#enableFollow{background:#1467ad}#disableFollow{background:#9a343f}#mode{width:100%}#distanceControls{display:flex;gap:8px;align-items:center}#distanceSlider{min-width:0;flex:1;width:80px}#distanceValue{width:64px;padding:8px;min-height:42px}#feedback{font-size:12px;color:#9fd3ff;overflow-wrap:anywhere}#feedback:empty{display:none}#help{order:unset!important}#controls>label{font-size:13px}#controls{display:flex}
</style></head><body><div id="workspace"><aside id="controls"><div id="motionActions"><button id="enableFollow">开启底盘跟随</button><button id="disableFollow">关闭底盘跟随</button></div><label>跟随对象<select id="mode"><option value="02_07_kcf">物体 · 画面框选</option><option value="04_09_body_tracking">人体 · 手势选择</option></select></label><label>跟随距离</label><div id="distanceControls"><input id="distanceSlider" aria-label="跟随距离滑块" type="range" min="0.2" max="3.5" step="0.05" value="2"><input id="distanceValue" aria-label="跟随距离米" type="number" min="0.2" max="3.5" step="0.05" value="2"><span>m</span></div><p id="feedback" role="status"></p><details id="help"><summary>操作说明</summary><p>选择跟随对象后，物体在画面中拖框选定；人体竖起大拇指进入跟随，握拳停止跟随。数字 1 前进、2 后退，不使用左右转向手势。</p><p>距离滑块松手或数字输入完成后直接生效。关闭底盘跟随保留识别画面；退出应用不等于停车。</p></details><main id="panel"></main></aside><section id="stage" class="vision-kcf-window" aria-label="实时相机画面"></section></div><div hidden><button id="back"></button><button id="navigation"></button><span id="connection"></span><p id="status"></p><div id="body"><button id="startBody"></button><button id="stopBody"></button><button id="motionBody"></button><input id="distance"><button id="applyDistance"></button><p id="bodyState"></p></div></div><script src="vision-reference.js"></script><script src="vision-follow.js"></script></body></html>
